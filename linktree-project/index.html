<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage">

    <div class="identity">
      <svg id="tree-svg" viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
        <!-- single continuous line growing rightward into the avatar, echoing a horizontal tree of links -->
        <path class="trunk-path" d="
          M 0 110
          C 30 110, 34 110, 48 110
          C 60 110, 64 70, 78 40
          M 48 110
          C 60 110, 64 150, 78 180
          M 48 110 C 60 110, 66 110, 78 110
        "/>
      </svg>
      <svg class="avatar-ring avatar-ring-wrap" width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="47" />
      </svg>

      <div class="avatar">M</div>
      <div class="name">Muhammad</div>
      <div class="tagline">Find me here</div>
    </div>

    <div class="divider"></div>

    <nav class="links">
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">Instagram</span><span class="sub">@muhammad</span></span>
      </a>
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">X / Twitter</span><span class="sub">@muhammad</span></span>
      </a>
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">LinkedIn</span><span class="sub">Profile</span></span>
      </a>
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">Portfolio</span><span class="sub">Website</span></span>
      </a>
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">Email me</span><span class="sub">Contact</span></span>
      </a>
      <a class="leaf" href="#">
        <span class="dot"></span>
        <span class="text"><span class="label">YouTube</span><span class="sub">Channel</span></span>
      </a>
    </nav>

  </div>

  <footer>Muhammad — All links in one place</footer>

  <script src="script.js"></script>
</body>
</html>
