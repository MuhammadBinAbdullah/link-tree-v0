    <style>#eventForm {
    max-width: 600px;
    margin: 40px auto;
    padding: 30px;
    background: #111827;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

#eventForm label {
    display: block;
    margin: 15px 0 8px;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
}

#eventForm input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #1e293b;
    color: #ffffff;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
}

#eventForm input:focus {
    border-color: #20d98b;
    box-shadow: 0 0 0 3px rgba(32,217,139,0.15);
}

#eventForm input::placeholder {
    color: #94a3b8;
}

#eventForm button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #20d98b;
    color: #000;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

#eventForm button:hover {
    background: #16c784;
    transform: translateY(-2px);
}

/* ===== FORM LIGHT MODE ===== */

body.light-mode #eventForm {
    background: #ffffff;
    border: 1px solid #dbe5ef;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

body.light-mode #eventForm label {
    color: #172337;
}

body.light-mode #eventForm input {
    background: #f8fafc;
    color: #172337;
    border: 1px solid #cbd5e1;
}

body.light-mode #eventForm input::placeholder {

}

body.light-mode #eventForm input:focus {

    border-color: #20d98b;

}

body.light-mode #eventForm button {

body.light-mode #eventForm button:hover {

/* LINKS LEFT + FORM RIGHT */

/* LEFT SIDE */

/* RIGHT SIDE */

    <form id="eventForm">

        <label for="UserName">UserName</label>
        <input
            type="text"
            id="UserName"
            required
            minlength="3"
            placeholder="Enter Your UserName"
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            required
            placeholder="Enter Your Email"
        >

        <label for="message">Message</label>

            type="text"
            id="message"

 <script src="script.js"></script>

 <script>
    const form = document.getElementById("eventForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("UserName").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    if (username.length < 3) {
        alert("Username must be at least 3 characters.");
        return;
    }

    if (!email || !message) {
        alert("Please fill in all fields.");
        return;
    }

    alert("Message sent successfully! 🚀");

    form.reset();
});
