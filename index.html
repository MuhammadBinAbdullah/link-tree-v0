<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muhammad | Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stage">

        <!-- LEFT SIDE -->
        <div class="identity">

            <svg id="tree-svg"
                viewBox="0 0 120 220"
                xmlns="http://www.w3.org/2000/svg">

                <path class="trunk-path"
                    d="
                    M 0 110
                    C 30 110, 34 110, 48 110
                    C 60 110, 64 70, 78 40

                    M 48 110
                    C 60 110, 64 150, 78 180

                    M 48 110
                    C 60 110, 66 110, 78 110
                    "
                />

            </svg>


            <!-- YOUR LOGO -->
<!-- YOUR LOGO -->
<div class="avatar">
    <img src="Logo.png" alt="Muhammad Logo">
</div>

            <div class="name">
                Muhammad
            </div>

            <div class="tagline">
                Find me here
            </div>

        </div>


        <!-- DIVIDER -->
        <div class="divider"></div>


        <!-- LINKS -->
        <nav class="links">


            <!-- INSTAGRAM -->
            <a
                class="leaf"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="social-icon"
                    src="Instagram.jpg"
                    alt="Instagram"
                >

                <span class="text">

                    <span class="label">
                        Instagram
                    </span>

                    <span class="sub">
                        @muhammad
                    </span>

                </span>

            </a>



            <!-- X / TWITTER -->
            <a
                class="leaf"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="social-icon"
                    src="X Twiter.jpg"
                    alt="X Twitter"
                >

                <span class="text">

                    <span class="label">
                        X / Twitter
                    </span>

                    <span class="sub">
                        @muhammad
                    </span>

                </span>

            </a>



            <!-- LINKEDIN -->
            <a
                class="leaf"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="social-icon"
                    src="Linkedin.png"
                    alt="LinkedIn"
                >

                <span class="text">

                    <span class="label">
                        LinkedIn
                    </span>

                    <span class="sub">
                        Professional Profile
                    </span>

                </span>

            </a>



            <!-- PORTFOLIO -->
            <a
                class="leaf"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    class="social-icon"
                    src="Portfolio.png"
                    alt="Portfolio"
                >

                <span class="text">

                    <span class="label">
                        Portfolio
                    </span>

                    <span class="sub">
                        My Website
                    </span>

                </span>

            </a>



            <!-- EMAIL -->
            <a
                class="leaf"
                href="mailto:your@email.com"
            >

                <img
                    class="social-icon"
                    src="Email.jpg"
                    alt="Email"
                >

                <span class="text">

                    <span class="label">
                        Email Me
                    </span>

                    <span class="sub">
                        Contact Me
                    </span>

                </span>

            </a>



            <!-- YOUTUBE -->
            <a
                class="leaf"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

    <img
                    class="social-icon"
                    src="YouTube.png"
                    alt="YouTube"
                >

                <span class="text">

                    <span class="label">
                        YouTube
                    </span>

                    <span class="sub">
                        Code With Muhammad
                    </span>

                </span>

            </a>

        </nav>

    </div>


    <footer>
        Muhammad — All links in one place
    </footer>


    <script src="script.js"></script>

</body>
</html>
